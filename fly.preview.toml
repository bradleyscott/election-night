# PR preview config used by .github/workflows/preview.yml.
#
# Differences from fly.toml:
#   - no [[mounts]] (previews do not get a volume)
#   - COLLECTOR_ENABLED = "false" (previews never poll the live feed)
#   - smaller VM
#
# State (result/feed caches) lives in the container filesystem and is thrown
# away when the preview is destroyed, which is fine for a preview.

app = "election-night-preview-placeholder"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile.app"

[http_service]
  internal_port = 3456
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "15s"
    method = "GET"
    path = "/health"
    protocol = "http"

[metrics]
  port = 3456
  path = "/metrics"

[env]
  NODE_ENV = "production"
  DIST_DIR = "/app/packages/dashboard/dist"
  COLLECTOR_ENABLED = "false"
  CACHE_PATH = "/data/electorate_results.json"
  FEED_CACHE_PATH = "/data/feed_events.json"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
