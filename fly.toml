app = "election-night"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile.app"

[http_service]
  internal_port = 3456
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "15s"
    method = "GET"
    path = "/health"
    protocol = "http"

[metrics]
  port = 3456
  path = "/metrics"

# SQLite history and the feed-event cache must survive restarts and deploys.
# Create once with: fly volumes create election_data --size 1 --region syd
[[mounts]]
  source = "election_data"
  destination = "/data"

# One process: the dashboard server owns the collector loop in-process, so
# there is no second port, no loopback Socket.io, and no history HTTP hop.
# Set COLLECTOR_ENABLED=false to serve the last written snapshot without
# polling (PR previews do this so they never hit the live feed).
[env]
  NODE_ENV = "production"
  DIST_DIR = "/app/packages/dashboard/dist"
  COLLECTOR_ENABLED = "true"
  ELECTION_YEAR = "2023"
  # The feed is a CDN-cached static asset with max-age 30s, and a full cycle
  # takes about a second, so polling faster than the CDN refreshes gains
  # nothing.
  POLL_INTERVAL_MS = "30000"
  DB_PATH = "/data/election_results.db"
  FEED_CACHE_PATH = "/data/feed_events.json"

# Ample headroom for the single Node process on election night. Raise with:
#   fly machine update <id> --memory 1024
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
