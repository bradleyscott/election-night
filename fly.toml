app = "election-night"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile.dashboard"

[http_service]
  internal_port = 3456
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"

[metrics]
  port = 3456
  path = "/metrics"

# Server-only app: the collector runs on the homelab and publishes results
# over Socket.io (WS_URL) plus history over HTTP (set HISTORY_UPSTREAM via
# `fly secrets set` to point at the homelab's history endpoint).
[env]
  NODE_ENV = "production"
  DIST_DIR = "/app/packages/dashboard/dist"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
