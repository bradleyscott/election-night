app = "election-night"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile.dashboard"

[http_service]
  internal_port = 3456
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"

[metrics]
  port = 3456
  path = "/metrics"

# Server-only app: the collector runs elsewhere and publishes results
# over Socket.io (WS_URL) plus history over HTTP. HISTORY_UPSTREAM is
# REQUIRED for history data — set it via `fly secrets set` to point at the
# collector's history endpoint (e.g. https://history.example.com). Without
# it the server defaults to http://127.0.0.1:3459, which is unreachable
# inside Fly, so the Trends page and /ready will show no history.
[env]
  NODE_ENV = "production"
  DIST_DIR = "/app/packages/dashboard/dist"

# 256mb keeps the machine inside the Legacy Hobby plan's free allowance
# (3x shared-cpu-1x 256MB VMs). Before election night, bump it:
#   fly machine update <id> --memory 1024
# then drop back after the result is settled:
#   fly machine update <id> --memory 256
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
