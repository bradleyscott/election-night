app = "election-night"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile.app"

[http_service]
  internal_port = 3456
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "15s"
    method = "GET"
    path = "/health"
    protocol = "http"

[metrics]
  port = 3456
  path = "/metrics"

# SQLite history and the result/feed caches must survive restarts and deploys.
# Create once with: fly volumes create election_data --size 1 --region syd
[[mounts]]
  source = "election_data"
  destination = "/data"

# Single app, single machine: the dashboard server (public, :3456) and the
# collector (loopback, :3459) run together from Dockerfile.app.
# Set COLLECTOR_ENABLED=false to run the dashboard alone (PR previews do this
# so they never poll the live feed).
[env]
  NODE_ENV = "production"
  DIST_DIR = "/app/packages/dashboard/dist"
  COLLECTOR_ENABLED = "true"
  ELECTION_YEAR = "2023"
  WS_URL = "ws://127.0.0.1:3456"
  HISTORY_UPSTREAM = "http://127.0.0.1:3459"
  DB_PATH = "/data/election_results.db"
  RESULTS_CACHE_PATH = "/data/electorate_results.json"
  CACHE_PATH = "/data/electorate_results.json"
  FEED_CACHE_PATH = "/data/feed_events.json"

# 512mb gives the collector headroom alongside the dashboard server. Before
# election night, bump to 1024 if needed:
#   fly machine update <id> --memory 1024
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
