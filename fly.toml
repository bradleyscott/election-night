app = "election-night"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile.app"

[http_service]
  internal_port = 3456
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "15s"
    method = "GET"
    path = "/health"
    protocol = "http"

# Application metrics. Fly scrapes exactly ONE metrics endpoint per process —
# multiple [[metrics]] sections only apply across Fly process groups, which are
# separate Machines. So the dashboard server's /metrics merges the collector's
# registry over loopback (COLLECTOR_METRICS_URL, defaulting to
# <HISTORY_UPSTREAM>/metrics). The collector still serves /metrics on :3459 for
# that merge and for standalone deployments.
[metrics]
  port = 3456
  path = "/metrics"

# SQLite history and the result/feed caches must survive restarts and deploys.
# Create once with: fly volumes create election_data --size 1 --region syd
[[mounts]]
  source = "election_data"
  destination = "/data"

# Single app, single machine: the dashboard server (public, :3456) and the
# collector (loopback, :3459) run together from Dockerfile.app.
# Set COLLECTOR_ENABLED=false to run the dashboard alone (PR previews do this
# so they never poll the live feed).
[env]
  NODE_ENV = "production"
  DIST_DIR = "/app/packages/dashboard/dist"
  COLLECTOR_ENABLED = "true"
  ELECTION_YEAR = "2026"
  # Quiet-period cadence: one sweep a day. The preliminary count finished on the
  # night (every seat counted) and the next change to the feed is the official
  # count, declared 20 days after election day (27 Nov 2026) — until then this is
  # a static asset. Each cycle asks every seat whether it changed
  # (If-Modified-Since: a 304 costs headers and no body) and a cycle that
  # publishes nothing new writes no snapshot, so a day here costs 71 conditional
  # requests rather than ~4,300 an hour.
  #
  # Restore 60000 (and 30000 for the final hour) in this file before the official
  # count is declared — a commit is what applies it, because `[env]` here
  # outranks an ad-hoc `fly machine update --env` on the next deploy. See README
  # "Machine size and poll cadence".
  POLL_INTERVAL_MS = "86400000"
  # Keep a day of snapshots; pruning runs on startup. Without it the volume
  # fills, SQLite starts failing every write with SQLITE_FULL, and the site
  # serves nothing (see docs/observability.md §6 for the alerts).
  RETENTION_HOURS = "24"
  WS_URL = "ws://127.0.0.1:3456"
  HISTORY_UPSTREAM = "http://127.0.0.1:3459"
  DB_PATH = "/data/election_results.db"
  RESULTS_CACHE_PATH = "/data/electorate_results.json"
  CACHE_PATH = "/data/electorate_results.json"
  FEED_CACHE_PATH = "/data/feed_events.json"
  # www → apex. The proxy serves both hostnames once both certs exist but does
  # not rewrite Host, so the app issues the 301 itself. Unset everywhere else
  # (previews, .fly.dev, local dev) means no redirect.
  CANONICAL_HOST = "election-night.live"

# Smallest Machine Fly offers (shared-cpu-1x / 256MB, ~$2.19/month) — a
# quiet-period size. The preliminary count is finished and the next thing to
# publish is the official count, so this only has to hold the dashboard, the
# collector's idle loop, one SQLite handle and whatever browsers are connected;
# `fly.preview.toml` runs the dashboard alone at the same size.
#
# Before the official count is declared, restore the election-night sizing here
# — 1 GB and two shared vCPUs:
#   [[vm]]
#     memory = "1gb"
#     cpu_kind = "shared"
#     cpus = 2
#
# Why those numbers: the dashboard holds every websocket in one process, so the
# memory is headroom for the connections alongside the collector, and the second
# vCPU is CPU quota rather than a second Node thread — Node runs one thread, but
# a shared vCPU is throttled, and the extra quota is what stops an 82 KB
# broadcast to every socket from stretching the event loop.
#
# Change the size here, not with `fly scale` or `fly machine update`: `[[vm]]`
# takes precedence, so the next deploy reverts an ad-hoc resize (the same rule
# as ELECTION_YEAR). A resize restarts the Machine, so do it before the count.
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
