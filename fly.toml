app = "election-night"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3456
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"

[metrics]
  port = 3456
  path = "/metrics"

[env]
  NODE_ENV = "production"
  DIST_DIR = "/app/packages/dashboard/dist"
  BASE_RESULTS_URL = "https://www.electionresults.govt.nz/electionresults_2023"
  WS_URL = "ws://localhost:3456"
  POLL_INTERVAL_MS = "120000"
  CONCURRENCY = "2"
  LOG_LEVEL = "3"
  DB_PATH = "/app/.data/election_results.db"

# Shared persistent storage for SQLite DB and JSON cache.
[[mounts]]
  source = "election_data"
  destination = "/app/.data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
