name: Security Checks

on:
  # Runs on every main push via the deploy workflow (deploy.yml), which gates the
  # production deploy on these checks passing. No standalone `push` trigger here,
  # otherwise security checks would run twice on each main push.
  workflow_call:
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Monday at 6am UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The gate that protects the deploy: a vulnerable production dependency
      # must never ship. Production is currently clean.
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high

      # Dev-only advisories are reported, not blocking. The residual set is the
      # `braces` chain under tailwindcss 3 — braces, chokidar, micromatch,
      # fast-glob — and braces has no fixed release: 3.0.3 is the newest version
      # published and the advisory covers <=3.0.3. `npm audit fix --force`'s only
      # answer is tailwindcss 4, which is a migration of its own. They are build
      # tools, with no runtime path and no attacker-controlled input.
      # Drop this split once braces ships a fix or the dashboard moves to
      # Tailwind 4, so the full audit can be the gate again.
      - name: npm audit (all dependencies, reported)
        continue-on-error: true
        run: npm audit --audit-level=high

  semgrep-analysis:
    name: Semgrep Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: semgrep scan --config p/ci --error .

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          extra_args: --only-verified
