name: Code checks

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      # The production image (Dockerfile.app) runs `vite build` and bundles the
      # server with esbuild, and neither was covered here. A dependency bump that
      # broke the dashboard build was therefore green on every check while main
      # could no longer produce a deployable image (tailwindcss 3 -> 4 in #85).
      - run: npm run build
      - run: npx esbuild packages/dashboard/server/index.ts --bundle --platform=node --format=cjs --outfile=/tmp/server.cjs --external:bufferutil --external:utf-8-validate
