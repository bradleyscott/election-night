name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            deploy:
              - 'Dockerfile.dashboard'
              - 'fly.toml'
              - 'packages/**'
              - 'tsconfig*.json'
              - 'package.json'
              - 'package-lock.json'
              - '.dockerignore'
              - '.github/workflows/checks.yml'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/security.yml'

  check:
    name: Lint, typecheck & test
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy == 'true'
    uses: ./.github/workflows/checks.yml

  security:
    name: Security checks
    uses: ./.github/workflows/security.yml

  deploy:
    name: Deploy to Fly
    needs: [changes, check, security]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --image-label "main-${{ github.sha }}"
