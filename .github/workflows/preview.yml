name: Deploy PR Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  FLY_REGION: syd

jobs:
  preview:
    # Dependabot-triggered runs have no access to GitHub Actions secrets
    # (FLY_API_TOKEN) and a read-only GITHUB_TOKEN, so preview deploys would
    # always fail for them. Skip entirely to avoid the noise.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Deploy preview
        if: github.event.action != 'closed'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_NAME="election-night-pr-${{ github.event.number }}"
          # Remove the app in case it was left orphaned from a previous failed run
          flyctl apps destroy "$APP_NAME" -y 2>/dev/null || true
          flyctl apps create "$APP_NAME" --org personal || exit 1
          flyctl deploy \
            --app "$APP_NAME" \
            --image-label "pr-${{ github.event.number }}" \
            --strategy immediate \
            --regions "$FLY_REGION" \
            --ha=false
          echo "deployed=true" >> $GITHUB_ENV
          echo "url=https://$APP_NAME.fly.dev" >> $GITHUB_ENV

      - name: Post preview URL
        if: github.event.action != 'closed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = process.env.url;
            const body = `## 🪶 Preview Environment\n\n[Open preview →](${url})\n\nThis PR is deployed as an isolated preview. Changes are reflected after each push.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body?.includes('Preview Environment')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Destroy preview
        if: github.event.action == 'closed'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_NAME="election-night-pr-${{ github.event.number }}"
          flyctl apps destroy "$APP_NAME" -y || true
